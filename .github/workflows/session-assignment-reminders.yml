name: Session Assignment Reminders

on:
  schedule:
    # Runs daily at 9:00 AM Brisbane time.
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder job
        run: |
          response_file="$(mktemp)"
          status_code="$(curl --show-error --silent \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.SESSIONEER_CRON_SECRET }}" \
            https://sessioneer-backend.onrender.com/jobs/session-assignment-reminders)"

          echo "Backend status: $status_code"
          echo "Backend response:"
          cat "$response_file"

          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            exit 1
          fi
