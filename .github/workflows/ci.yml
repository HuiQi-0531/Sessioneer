name: CI

# Runs every test suite on each pull request (opened, or new commits pushed)
# and on every push to main. Any failing step fails the check, and branch
# protection on main requires this check to pass before merging.
#
# No real secrets or database addresses are used here: the tests run against
# a throwaway PostgreSQL service that only exists for the length of the job,
# and every email is mocked (backend) or disabled (E2E).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway database inside the job. The name must contain "test": the test
  # set-up refuses any other database because it wipes it.
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sessioneer_test

jobs:
  backend:
    name: Backend tests (logic, API, integration, RBAC)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sessioneer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Logic tests
        run: npm run test:logic

      - name: API tests
        run: npm run test:api

      - name: Integration tests
        run: npm run test:integration

      - name: RBAC tests
        run: npm run test:rbac

  frontend:
    name: Frontend component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Component tests (run once, no watch mode)
        run: npm test -- --watchAll=false
        env:
          CI: true

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sessioneer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E stories
        # Playwright starts the backend (test database) and the React dev server itself.
        run: npx playwright test
        working-directory: e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/results/
          retention-days: 7
