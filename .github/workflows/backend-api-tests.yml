name: Backend API Tests

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: sessioneer
          POSTGRES_PASSWORD: sessioneer
          POSTGRES_DB: sessioneer_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sessioneer -d sessioneer_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://sessioneer:sessioneer@localhost:5432/sessioneer_test_db
      JWT_SECRET: sessioneer-ci-test-secret
      FRONTEND_URL: http://localhost:3000
      EMAIL_FROM: Sessioneer CI <test@example.com>
      BREVO_API_KEY: test-brevo-key
      CRON_SECRET: sessioneer-ci-cron-secret
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      SUPABASE_STORAGE_BUCKET: message-attachments
      SUPABASE_AVATAR_BUCKET: profile-avatars

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run API and integration tests
        run: npm run test:api

      - name: Generate coverage report
        run: npm run test:api:coverage
